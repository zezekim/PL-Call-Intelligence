name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check callsentry tests
      - run: mypy callsentry
      - run: pytest -q

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipecat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callsentry
          POSTGRES_PASSWORD: callsentry
          POSTGRES_DB: callsentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U callsentry" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://callsentry:callsentry@localhost:5432/callsentry
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: e2e-jwt-secret
      INTERNAL_API_TOKEN: e2e-internal-token
      UPLOAD_DIR: /tmp/uploads
      CALLSENTRY_LOCAL_ONLY: "1"
      SEED_ADMIN_EMAIL: admin@pestlaunch.local
      SEED_ADMIN_PASSWORD: e2e-password-1234
      E2E_EMAIL: admin@pestlaunch.local
      E2E_PASSWORD: e2e-password-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start the API
        working-directory: app
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'import base64,secrets;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" >> "$GITHUB_ENV"
          pip install -e ".[dev]"
      - working-directory: app
        run: |
          alembic upgrade head
          python -m callsentry.scripts.seed
          python -m callsentry.scripts.e2e_fixture
          nohup uvicorn callsentry.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
      - name: Start the dashboard
        working-directory: dashboard
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
          nohup npx next start -p 3000 > /tmp/dashboard.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null localhost:3000/login && break; sleep 1; done
      - name: Browser tests
        working-directory: dashboard
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - name: Logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/dashboard.log

  deploy:
    # Only pushes to main reach the server; pull requests never run on it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, voice, dashboard, e2e]
    runs-on: [self-hosted, pestlaunch]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: |
          export APP_VERSION="$(cat VERSION)" BUILD_ID="${GITHUB_SHA::7}"
          docker compose --env-file /opt/pestlaunch/.env up -d --build --remove-orphans
      - name: Reload proxy config
        run: docker compose --env-file /opt/pestlaunch/.env exec -T caddy caddy reload --config /etc/caddy/Caddyfile
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file /opt/pestlaunch/.env exec -T app \
                python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file /opt/pestlaunch/.env logs --tail 50 app
          exit 1
      - name: Clean up old images
        run: docker image prune -f
