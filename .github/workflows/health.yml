name: health

# A failed run is emailed to the repository owner by GitHub.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: API answers
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 20 https://pestlaunch.ramil.org/api/health | grep -q '"status":"ok"'
      - name: Dashboard answers
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 20 -o /dev/null https://pestlaunch.ramil.org/login
