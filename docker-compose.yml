name: pestlaunch

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://callsentry:${POSTGRES_PASSWORD:-callsentry}@postgres:5432/callsentry
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  WORKER_BASE_URL: http://worker:8100
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  PUBLIC_WS_URL: ${PUBLIC_WS_URL:-wss://localhost}
  CALLSENTRY_LOCAL_ONLY: ${CALLSENTRY_LOCAL_ONLY:-0}
  DEMO_VIEWER_EMAIL: ${DEMO_VIEWER_EMAIL:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env - run "make env"}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - run "make env"}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env - run "make env"}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
  CALL_INTEL_MODEL: ${CALL_INTEL_MODEL:-claude-sonnet-5}
  CALL_STT_ENGINE: ${CALL_STT_ENGINE:-auto}
  DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
  UPLOAD_DIR: /data/uploads
  INTEL_WORKERS: ${INTEL_WORKERS:-2}
  INTEL_SCORING_RUNS: ${INTEL_SCORING_RUNS:-3}
  DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-20}
  SMS_CONFIRMATIONS: ${SMS_CONFIRMATIONS:-0}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  RETELL_API_KEY: ${RETELL_API_KEY:-}
  CALCOM_API_KEY: ${CALCOM_API_KEY:-}
  CALCOM_BASE_URL: ${CALCOM_BASE_URL:-https://api.cal.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  APP_VERSION: ${APP_VERSION:-dev}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # The directory, not the file: a checkout replaces the file, and a
      # single-file mount would keep serving the old one.
      - ./caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - dashboard
      - pipecat

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: callsentry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callsentry}
      POSTGRES_DB: callsentry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsentry -d callsentry"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./worker
      args:
        WITH_TTS: ${WORKER_WITH_TTS:-0}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - modeldata:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: /api
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_ID: ${BUILD_ID:-local}
    restart: unless-stopped
    depends_on:
      - app

  # AI receptionist: Twilio media streams. Speech and conversation go
  # through the API, which prefers cloud providers on live calls.
  pipecat:
    build:
      context: ./pipecat
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_BASE_URL: http://app:8000
    depends_on:
      - app

  # Optional local language model:  docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  ollamadata:
  modeldata:
  uploads:
  caddydata:
  caddyconfig:
