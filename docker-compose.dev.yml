# Local development: expose the database and worker to services run natively.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis worker
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  worker:
    ports:
      - "127.0.0.1:8100:8100"
